<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поличка — фільми, книги й платівки</title>
<meta name="description" content="Приватна поличка для фільмів, серіалів, книг і музичних альбомів.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="hero">
  <div class="hero__orbit" aria-hidden="true">
    <svg class="moon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M62 8C40 8 22 26 22 50s18 42 40 42c6 0 12-1.3 17-3.7C63 82 48 68 48 50s15-32 31-38.3C74 9.3 68 8 62 8z" fill="currentColor"/>
    </svg>
    <span class="orbit-dot dot1"></span>
    <span class="orbit-dot dot2"></span>
    <span class="orbit-dot dot3"></span>
  </div>
  <p class="hero__eyebrow">приватна колекція</p>
  <h1 class="hero__title">Поличка</h1>
  <p class="hero__tagline">тут живуть фільми, книжки й платівки,<br class="br-mobile"> які я не хочу забути</p>
</header>

<nav class="tabs" role="tablist" aria-label="Категорії">
  <button class="tab is-active" data-category="movies" role="tab" aria-selected="true">
    <svg class="tab__icon" viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="1" y="1" width="46" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M9 1 L15 12 L9 12 Z M39 1 L33 12 L39 12 Z" fill="currentColor" opacity=".6"/>
      <circle cx="15" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="33" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="15" cy="20" r="1.4" fill="currentColor"/>
      <circle cx="33" cy="20" r="1.4" fill="currentColor"/>
    </svg>
    <span>Фільми та серіали</span>
  </button>
  <button class="tab" data-category="books" role="tab" aria-selected="false">
    <svg class="tab__icon" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M20 6C16 3 9 2 3 3v23c6-1 13 0 17 3 4-3 11-4 17-3V3c-6-1-13 0-17 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 6v23" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span>Книги</span>
  </button>
  <button class="tab" data-category="music" role="tab" aria-selected="false">
    <svg class="tab__icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
      <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
      <circle cx="16" cy="16" r="2.4" fill="currentColor"/>
    </svg>
    <span>Музика</span>
  </button>
</nav>

<main id="main">
  <section class="shelf-section is-active" data-category="movies" aria-label="Фільми та серіали">
    <div class="shelf-row" id="shelf-movies"></div>
    <div class="shelf-plank"><span class="shelf-plank__edge"></span></div>
  </section>

  <section class="shelf-section" data-category="books" hidden aria-label="Книги">
    <div class="shelf-row" id="shelf-books"></div>
    <div class="shelf-plank"><span class="shelf-plank__edge"></span></div>
  </section>

  <section class="shelf-section" data-category="music" hidden aria-label="Музика">
    <div class="shelf-row" id="shelf-music"></div>
    <div class="shelf-plank"><span class="shelf-plank__edge"></span></div>
  </section>
</main>

<button class="fab" id="addBtn" aria-label="Додати річ на поличку">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
    <button class="modal-close" id="modalClose" aria-label="Закрити">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="modal-visual" id="modalVisual"></div>

    <div class="modal-body">
      <h2 class="modal-heading" id="modalHeading">Нова річ на поличці</h2>

      <div class="field-row">
        <label class="field field--half">
          <span class="field__label">Категорія</span>
          <select id="fieldCategory" class="field__input">
            <option value="movies">Фільм / серіал</option>
            <option value="books">Книга</option>
            <option value="music">Музика</option>
          </select>
        </label>
        <label class="field field--half">
          <span class="field__label">Колір корінця</span>
          <div class="swatches" id="swatches"></div>
        </label>
      </div>

      <label class="field">
        <span class="field__label">Назва</span>
        <input class="field__input" id="fieldTitle" type="text" placeholder="напр. Твін Пікс" maxlength="80">
      </label>

      <label class="field">
        <span class="field__label" id="fieldSubtitleLabel">Режисер / автор / виконавець</span>
        <input class="field__input" id="fieldSubtitle" type="text" placeholder="необов'язково" maxlength="80">
      </label>

      <label class="field">
        <span class="field__label">Обкладинка</span>
        <div class="file-row">
          <label class="btn btn--ghost btn--small file-btn">
            <input type="file" id="fieldCoverFile" accept="image/*" hidden>
            Завантажити зображення
          </label>
          <span class="file-name" id="fileName">не обрано</span>
        </div>
      </label>

      <label class="field">
        <span class="field__label">Нотатки, враження, цитати…</span>
        <textarea class="field__input field__textarea" id="fieldComment" rows="4" placeholder="що я відчула, коли переглянула / прочитала / прослухала це…"></textarea>
      </label>

      <div class="modal-actions">
        <button class="btn btn--ghost" id="deleteBtn" hidden>Прибрати з полички</button>
        <button class="btn btn--primary" id="saveBtn">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer class="footer">
  <p>зроблено з ніжністю • дані живуть лише у цьому браузері</p>
</footer>

<script src="script.js"></script>
</body>
</html>
